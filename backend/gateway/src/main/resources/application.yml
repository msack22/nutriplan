# ============================================================ gateway (BFF)
server:
  port: 8080
  forward-headers-strategy: framework   # respeta X-Forwarded-* (proxy de Angular / load balancer)
  servlet:
    session:
      timeout: 30m
      cookie:
        name: NUTRIPLAN_SESSION
        http-only: true                 # JavaScript no puede leer la cookie (mitiga XSS)
        same-site: lax                  # mitiga CSRF entre sitios
        secure: false                   # true en producción (HTTPS)

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  session:
    redis:
      namespace: nutriplan:session      # Spring Session guarda la sesión (y los tokens) en Redis
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: nutriplan-bff
            client-secret: ${BFF_CLIENT_SECRET:bff-dev-secret-change-me}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid,profile,email,offline_access
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nutriplan}

nutriplan:
  security:
    resource-server:
      enabled: false                    # el gateway es OAuth2 CLIENT (login), no resource server
  frontend-url: ${FRONTEND_URL:http://localhost:4200/}
  routes:
    recipe: ${RECIPE_SERVICE_URL:http://localhost:8081}
    planner: ${PLANNER_SERVICE_URL:http://localhost:8082}
    pricing: ${PRICING_SERVICE_URL:http://localhost:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
