# ============================================================ planner-service
server:
  port: 8082
  address: ${SERVER_ADDRESS:127.0.0.1}   # solo localhost: se accede vía gateway/proxy (en Docker: 0.0.0.0)
  shutdown: graceful

spring:
  application:
    name: planner-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/planner_db
    username: ${DB_USER:planner_svc}
    password: ${DB_PASSWORD:planner_dev_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_batch_fetch_size: 50
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
  cache:
    type: redis
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      auto-offset-reset: earliest
  security:
    oauth2:
      client:
        # Client Credentials: planner-service se identifica ante Keycloak como "planner-service"
        registration:
          planner-service:
            provider: keycloak
            client-id: planner-service
            client-secret: ${PLANNER_CLIENT_SECRET:planner-dev-secret-change-me}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/nutriplan/protocol/openid-connect/token}

nutriplan:
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nutriplan}
    jwk-set-uri: ${NUTRIPLAN_SECURITY_JWK_SET_URI:http://localhost:8180/realms/nutriplan/protocol/openid-connect/certs}
  clients:
    recipe-url: ${RECIPE_SERVICE_URL:http://localhost:8081}
    pricing-url: ${PRICING_SERVICE_URL:http://localhost:8083}

springdoc:
  swagger-ui:
    oauth:
      client-id: nutriplan-swagger
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
