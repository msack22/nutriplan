# ============================================================ pricing-service
server:
  port: 8083
  address: ${SERVER_ADDRESS:127.0.0.1}   # solo localhost: se accede vía gateway/proxy (en Docker: 0.0.0.0)
  shutdown: graceful

spring:
  application:
    name: pricing-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/pricing_db
    username: ${DB_USER:pricing_svc}
    password: ${DB_PASSWORD:pricing_dev_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      auto-offset-reset: earliest
  cloud:
    function:
      definition: refreshPrices;estimatePrices   # funciones expuestas (Lambda usa una)
  security:
    oauth2:
      client:
        registration:
          pricing-service:
            provider: keycloak
            client-id: pricing-service
            client-secret: ${PRICING_CLIENT_SECRET:pricing-dev-secret-change-me}
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/nutriplan/protocol/openid-connect/token}

nutriplan:
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/nutriplan}
    jwk-set-uri: ${NUTRIPLAN_SECURITY_JWK_SET_URI:http://localhost:8180/realms/nutriplan/protocol/openid-connect/certs}
  clients:
    recipe-url: ${RECIPE_SERVICE_URL:http://localhost:8081}

pricing:
  scheduler:
    enabled: true
  refresh:
    cron: "0 0 6 * * MON"     # todos los lunes 06:00 (para diario: "0 0 6 * * *")
    throttle-ms: 150          # pausa entre requests: scraping responsable
  estimate:
    max-live-lookups: 10
  chains:                     # supermercados con API VTEX pública
    - { id: dia,       name: "Día",       host: diaonline.supermercadosdia.com.ar, enabled: true }
    - { id: jumbo,     name: "Jumbo",     host: www.jumbo.com.ar,                  enabled: true }
    - { id: carrefour, name: "Carrefour", host: www.carrefour.com.ar,              enabled: true }
    - { id: vea,       name: "Vea",       host: www.vea.com.ar,                    enabled: false }
    - { id: disco,     name: "Disco",     host: www.disco.com.ar,                  enabled: false }

springdoc:
  swagger-ui:
    oauth:
      client-id: nutriplan-swagger
      use-pkce-with-authorization-code-grant: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
